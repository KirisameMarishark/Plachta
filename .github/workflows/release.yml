name: Go Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: plachta-linux-amd64
          - goos: linux
            goarch: arm64
            output: plachta-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o "${{ matrix.output }}" ./cmd/plachta-go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: plachta-linux-amd64
          path: release

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: plachta-linux-arm64
          path: release

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/plachta-linux-amd64 \
            release/plachta-linux-arm64 \
            --repo "${{ github.repository }}" \
            --generate-notes